<!DOCTYPE html>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){

 const button=document.createElement('button');
 button.className='profile-btn';
 button.id='piLoginButton';

 document.querySelector('.header-tools').appendChild(button);

 const notice=document.getElementById('piNotice');

 const logout=document.createElement('button');
 logout.className='cancel';
 logout.type='button';

 document.querySelector('#profileModal .dialogbuttons').appendChild(logout);

 const labels={
 fa:['ورود با Pi','خروج از حساب','با حساب پای وارد شوید.'],
 en:['Sign in with Pi','Sign out','Sign in with your Pi account.'],
 ku:['چوونەژوورەوە بە Pi','چوونەدەرەوە','بە هەژماری Pi بچۆ ژوورەوە.'],
 ar:['الدخول عبر Pi','تسجيل الخروج','سجل الدخول بحساب Pi.'],
 tr:['Pi ile giriş','Çıkış yap','Pi hesabınızla giriş yapın.'],
 de:['Mit Pi anmelden','Abmelden','Mit deinem Pi-Konto anmelden.'],
 fr:['Connexion avec Pi','Déconnexion','Connectez-vous avec Pi.'],
 es:['Entrar con Pi','Cerrar sesión','Inicia sesión con Pi.'],
 zh:['使用 Pi 登录','退出登录','使用 Pi 账户登录。'],
 ja:['Pi でログイン','ログアウト','Pi アカウントでログインしてください。'],
 hi:['Pi से लॉगिन','लॉग आउट','अपने Pi खाते से लॉगिन करें।']
 };

 let piUser=null;
 let busy=false;
 let initialized=false;
 let ready=false;

 function updatePi(){

  const l=labels[lang]||labels.en;

  button.textContent='π '+(piUser||l[0]);

  notice.textContent=piUser
   ?'Pi: '+piUser+' ✓'
   :l[2];

  logout.textContent=l[1];

  logout.style.display=piUser
   ?'block'
   :'none';

  button.disabled=busy||!ready;
  logout.disabled=busy;

 }

 updatePi();

 document.getElementById('languageSelect')
 .addEventListener('change',updatePi);

 if(!window.supabase){

  notice.textContent='Supabase SDK unavailable. Reload the page.';
  return;

 }

 const db=window.supabase.createClient(

  'https://zrawtpvuvnkrsoewhhws.supabase.co',

  'sb_publishable__dGQU6oQ6u4WXLLb8UZJkg_6UTIu0CI',

  {
   auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:false
   }
  }

 );

 window.piloopDB=db;

 db.auth.onAuthStateChange((event,session)=>{

  piUser=session?.user?.app_metadata?.pi_uid
   ?session.user.user_metadata?.pi_username||null
   :null;

  ready=true;
  updatePi();

 });

 button.onclick=async function(){

  if(busy||!ready)return;

  if(piUser){

   profile();
   return;

  }

  busy=true;
  updatePi();

  try{

   if(!window.Pi){

    throw new Error('Pi SDK not loaded');

   }

   if(!initialized){

    Pi.init({
     version:'2.0',
     sandbox:false
    });

    initialized=true;

   }

   const auth=await Pi.authenticate(
    ['username'],
    ()=>console.warn('Incomplete payment')
   );

   const response=await fetch(

    'https://zrawtpvuvnkrsoewhhws.supabase.co/functions/v1/pi-auth-verify',

    {
     method:'POST',

     headers:{
      'Content-Type':'application/json'
     },

     body:JSON.stringify({
      accessToken:auth.accessToken
     })

    }

   );

   const verified=await response.json();

   if(
    !response.ok||
    verified.success!==true||
    !verified.user?.uid||
    !verified.user?.username||
    !verified.user?.profile_id
   ){

    throw new Error('Pi verification failed');

   }

   if(
    !verified.session?.access_token||
    !verified.session?.refresh_token
   ){

    throw new Error('Session not received');

   }

   const {data,error}=await db.auth.setSession({

    access_token:verified.session.access_token,

    refresh_token:verified.session.refresh_token

   });

   if(error||!data.session){

    throw new Error('Session activation failed');

   }

   if(
    data.user?.id!==verified.user.profile_id||
    data.user?.app_metadata?.pi_uid!==verified.user.uid
   ){

    await db.auth.signOut({scope:'local'});

    throw new Error('Account mismatch');

   }

   piUser=verified.user.username;

   updatePi();

   profile();

  }catch(error){

   alert('Pi Error: '+error.message);

  }finally{

   busy=false;
   updatePi();

  }

 };

 logout.onclick=async function(){

  if(busy)return;

  busy=true;
  updatePi();

  try{

   const {error}=await db.auth.signOut({
    scope:'local'
   });

   if(error)throw error;

   piUser=null;

   closeModal('profileModal');

  }catch(error){

   alert('Logout Error: '+error.message);

  }finally{

   busy=false;
   updatePi();

  }

 };

})();
</script>
</body>
</html>
