<!DOCTYPE html>  <html lang="fa" dir="rtl">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">  
<meta name="theme-color" content="#51249b">  
<title>PiLoop</title>  
<style>  
:root{--p:#51249b;--p2:#7545c7;--gold:#edbd50;--bg:#f7f5fc;--ink:#272239;--muted:#777187}  
*{box-sizing:border-box}  
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif;line-height:1.8}  
button,input,textarea,select{font:inherit}  
button{cursor:pointer}  
header{background:linear-gradient(125deg,#30145e,#7444c4);color:white;padding:20px 5% 28px;border-radius:0 0 26px 26px}  
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}  
.logo{font-size:28px;font-weight:900;letter-spacing:.5px}  
.logo span{color:var(--gold)}  
.header-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}  
.header-tools select{background:white;color:#32145e;border:0;border-radius:10px;padding:9px;max-width:170px}  
.profile-btn{background:var(--gold);color:#32145e;border:0;border-radius:10px;padding:9px 13px;font-weight:bold}  
.hero{max-width:800px;margin:25px 0 5px}  
.hero h1{font-size:clamp(23px,5vw,36px);margin:0 0 8px;line-height:1.5}  
.hero p{color:#eee;margin:0 0 18px}  
.search{background:white;display:flex;padding:6px;border-radius:13px;gap:6px}  
.search input{flex:1;min-width:0;border:0;outline:0;padding:10px;color:#222}  
.search button{background:var(--p);color:white;border:0;border-radius:9px;padding:8px 15px}  
main{max-width:1150px;margin:auto;padding:20px 15px 110px}  
.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 12px}  
.heading h2{font-size:19px;margin:0}  
.small{font-size:12px;color:var(--muted)}  
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}  
.category{background:white;border:1px solid #ebe7f2;border-radius:16px;padding:13px 5px;text-align:center;color:var(--ink)}  
.category .emoji{display:block;font-size:29px}  
.category strong{font-size:12px}  
.category.active{border:2px solid var(--gold);background:#fffaf0}  
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}  
.filters button{background:white;border:1px solid #e4ddec;color:var(--p);border-radius:22px;padding:7px 13px;font-size:12px}  
.filters button.active{background:var(--p);color:white}  
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}  
.card{background:white;border:1px solid #eee;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #2e175b0b}  
.cover{height:130px;background:linear-gradient(135deg,#e9defb,#fff0cd);display:grid;place-items:center;font-size:48px}  
.cardbody{padding:13px}  
.card h3{font-size:15px;margin:0 0 6px}  
.card p{font-size:12px;color:var(--muted);margin:5px 0 10px;overflow-wrap:anywhere}  
.meta{font-size:11px;color:var(--muted)}  
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}  
.actions button{flex:1;border:0;border-radius:9px;padding:8px 5px;font-size:11px;background:#f0ebfa;color:var(--p)}  
.actions .view{background:var(--p);color:white}  
.actions .delete{background:#fff0f0;color:#b32626}  
.empty{grid-column:1/-1;background:white;border-radius:15px;padding:25px;text-align:center;color:var(--muted)}  
nav{position:fixed;bottom:0;left:0;right:0;background:white;box-shadow:0 -4px 16px #0001;display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:5}  
nav button{border:0;background:transparent;color:#777;font-size:10px;display:flex;flex-direction:column;align-items:center}  
nav span{font-size:20px}  
nav button.active{color:var(--p);font-weight:bold}  
.fab{position:fixed;bottom:75px;left:15px;z-index:6;background:var(--gold);color:#32145e;border:0;border-radius:30px;padding:12px 17px;font-weight:bold;box-shadow:0 4px 14px #0002}  
.modal{display:none;position:fixed;inset:0;background:#17102099;z-index:10;align-items:center;justify-content:center;padding:14px}  
.modal.show{display:flex}  
.dialog{width:min(100%,520px);max-height:90vh;overflow:auto;background:white;border-radius:19px;padding:19px}  
.dialog h2{margin:0 0 13px;font-size:20px}  
.dialog label{font-size:12px;font-weight:bold}  
.dialog input,.dialog textarea,.dialog select{display:block;width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px;background:white;color:#222}  
.dialog textarea{min-height:90px}  
.dialogbuttons{display:flex;gap:8px;margin-top:12px}  
.dialogbuttons button{flex:1;border:0;border-radius:10px;padding:10px}  
.primary{background:var(--p);color:white}  
.cancel{background:#eee;color:#333}  
.detailtext{white-space:pre-wrap;overflow-wrap:anywhere}  
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}  
@media(max-width:700px){.categories{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}  
@media(max-width:430px){.cards{grid-template-columns:1fr}.cover{height:120px}}  
.card.pi-featured{border:2px solid var(--gold);box-shadow:0 4px 18px #edbd5040}
.pi-featured-label{background:var(--gold);color:#32145e;padding:5px 12px;font-size:12px;font-weight:bold}
.actions .pi-feature-button{background:var(--gold);color:#32145e;font-weight:bold}
</style>  
</head>

<header>  
 <div class="head">  
  <div class="logo">Pi<span>Loop</span></div>

 </div>  
 <div class="hero">  
  <h1 id="heroTitle"></h1>  
  <p id="heroText"></p>  
  <div class="search">  
   <input id="search" oninput="render()">  
   <button id="searchButton" onclick="runSearch()"></button>  
  </div>  
 </div>  
</header>  <main>  
 <div class="heading"><h2 id="categoriesTitle"></h2><span class="small" id="categoryCount"></span></div>  
 <div class="categories" id="categories"></div>  
 <div class="heading">  
  <h2 id="listHeading"></h2>  
  <span class="small" id="total"></span>  
 </div>  
 <div class="filters">  
  <button id="filterAll" class="active" ></button>  
  <button id="filterSaved" ></button>  
  <button id="filterMine" ></button>  
 </div>  
 <div class="cards" id="results"></div>  
 <footer>PiLoop · Connect · Discover · Collaborate</footer>  
</main>  <button class="fab" id="addButton" onclick="openAdd()"></button>

<nav>  
 <button class="active" onclick="home(this)"><span>⌂</span><b id="navHome"></b></button>  
 <button onclick="searchFocus()"><span>⌕</span><b id="navSearch"></b></button>  
 <button id="savedNavButton"><span>♥</span><b id="navSaved"></b></button>

 <button onclick="profile()"><span>👤</span><b id="navProfile"></b></button>  
</nav>  <div class="modal" id="addModal">

  <h2 id="formHeading"></h2>  
  <form id="addForm">

   <input id="title" required maxlength="90">  
   <label id="labelCategory"></label>  
   <select id="category"></select>  
   <label id="labelDescription"></label>  
   <textarea id="description" required maxlength="1000"></textarea>  
   <label id="labelLocation"></label>  
   <input id="location">  
   <label id="labelContact"></label>

    <button type="button" class="cancel" id="cancelButton" onclick="closeModal('addModal')"></button>  
    <button type="submit" class="primary" id="submitButton"></button>  
   </div>  
  </form>  
 </div>  
</div>  <div class="modal" id="detailModal">  
 <div class="dialog">

  <p class="detailtext" id="detailDescription"></p>  
  <p id="detailLocation" class="small"></p>  
  <p id="detailContact"></p>  
  <div class="dialogbuttons">  
   <button class="cancel" id="closeDetail" onclick="closeModal('detailModal')"></button>  
   <button class="primary" id="detailFavorite"></button>  
  </div>  
 </div>  
</div>  <div class="modal" id="profileModal">

   <button class="cancel" id="closeProfile" onclick="closeModal('profileModal')"></button>  
  </div>  
 </div>

function resetImage(){preview.imageToken=null;if(previewURL)URL.revokeObjectURL(previewURL);previewURL=null;imageInput.value='';preview.removeAttribute('src');preview.hidden=true;clearImage.hidden=true;}
function validImage(f){return ['image/jpeg','image/png','image/webp'].includes(f.type)&&f.size>0&&f.size<=5*1024*1024;}
imageInput.onchange=()=>{preview.imageToken=null;const f=imageInput.files[0];if(previewURL)URL.revokeObjectURL(previewURL);previewURL=null;preview.hidden=true;clearImage.hidden=true;if(!f)return;if(!validImage(f)){resetImage();alert(message('عکس معتبر تا ۵ مگابایت انتخاب کنید.','Choose a valid JPG, PNG or WebP up to 5 MB.'));return;}previewURL=URL.createObjectURL(f);preview.src=previewURL;preview.hidden=false;clearImage.hidden=false;};
clearImage.onclick=()=>{resetImage();preview.imageToken=null;removePhoto=!!editing;};
function imagePath(item){return typeof item.image_url==='string'&&item.image_url.startsWith(item.owner_id+'/')?item.image_url:null;}
async function cleanupListingImage(path,owner){
 if(!path||onlineUser!==owner||!path.startsWith(owner+'/'))return;
 try{
  const db=window.piloopDB;
  const {data:refs,error:checkError}=await db.from('listings').select('id').eq('image_url',path).limit(1);
  if(checkError)throw checkError;
  if(refs.length||onlineUser!==owner)return;
  const {error}=await db.storage.from('listing-images').remove([path]);
  if(error)throw error;
 }catch(error){console.warn('Image cleanup failed',error);alert(message('آگهی ذخیره یا حذف شد، اما پاک‌سازی فایل عکس ناموفق بود.','Listing change saved, but image cleanup failed.'));}
}
async function showImage(item,img){const path=imagePath(item), user=onlineUser;img.hidden=true;img.removeAttribute('src');if(!path)return;const token=Symbol();img.imageToken=token;try{const {data,error}=await window.piloopDB.storage.from('listing-images').createSignedUrl(path,300);if(!error&&data?.signedUrl&&img.imageToken===token&&user===onlineUser&&img.isConnected){img.src=data.signedUrl;img.hidden=false;}}catch(e){console.warn('Image unavailable',e);}}

function message(fa,en){return lang==='fa'?fa:en;}
async function refreshListings(){
 const version=++loadVersion, db=window.piloopDB;
 if(!db)return false;
 const {data,error}=await db.from('listings').select('id,owner_id,category,title,description,location,contact_info,status,image_url,featured_until').order('created_at',{ascending:false});
 if(version!==loadVersion)return false;
 if(error){alert(message('خطا در دریافت آگهی‌ها: ','Unable to load listings: ')+error.message);return false;}
 onlineItems=data.map(x=>({...x,id:String(x.id),contact:x.contact_info||'',owner:onlineUser&&x.owner_id===onlineUser?'mine':'other'}));render();return true;
}

 favoritesReady=false;

function isFeatured(item){return item.status==='approved'&&Date.parse(item.featured_until)>Date.now();}
let featureBusy=false;
async function showFeaturedSettings(id,button){
 const user=onlineUser;
 if(featureBusy||!user||!onlineItems.some(x=>x.id===id&&x.owner_id===user&&x.status==='approved'))return;
 featureBusy=true;button.disabled=true;
 try{
  const {data,error}=await window.piloopDB.auth.getSession();
  if(error||!data.session||data.session.user.id!==user)throw new Error('Session unavailable');
  const response=await fetch('https://zrawtpvuvnkrsoewhhws.supabase.co/functions/v1/pi-payment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({action:'settings'})});
  const settings=await response.json();
  if(!response.ok||settings.success!==true||!Number.isFinite(Number(settings.featured_price))||Number(settings.featured_price)<=0||!Number.isInteger(Number(settings.featured_days))||Number(settings.featured_days)<=0)throw new Error('Settings unavailable');
  if(onlineUser!==user)return;
  const l=featureText();alert('⭐ '+l[0]+'\n\n'+settings.featured_price+' Pi / '+settings.featured_days+' '+l[2]+'\n\n'+l[3]);
 }catch(e){if(onlineUser===user)alert(featureText()[4]);}finally{featureBusy=false;button.disabled=false;}
}

function changeLanguage(value){  
 if(!translations[value])return;  
 lang=value;  
 localStorage.setItem("piloop_language",lang);  
 applyLanguage();  
}  
function categoryKeys(){  
 return ["services","products","digital","community","opportunities","learning","events","help"];  
}  
function buildCategorySelect(){  
 const select=document.getElementById("category");  
 const old=select.value;  
 select.innerHTML="";  
 categoryKeys().forEach((key,i)=>{  
  const option=document.createElement("option");  
  option.value=key;  
  option.textContent=t().categoriesList[i];  
  select.appendChild(option);  
 });  
 if(old)select.value=old;  
}  
function drawCategories(){  
 const box=document.getElementById("categories");  
 box.innerHTML="";  
 categoryKeys().forEach((key,i)=>{  
  const b=document.createElement("button");  
  b.className="category"+(activeCategory===key?" active":"");  
  b.innerHTML=`<span class="emoji">${["🛠️","🛍️","💻","🌍","🤝","📚","🎫","💛"][i]}</span><strong></strong>`;  
  b.querySelector("strong").textContent=t().categoriesList[i];  
  b.onclick=()=>{  
   activeCategory=activeCategory===key?"all":key;  
   currentView="all";  
   document.getElementById("listHeading").textContent=activeCategory==="all"?t().latest:t().categoriesList[i];  
   document.getElementById("search").value="";  
    document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b.id==="filterAll"));  
    drawCategories();render();showResults();  
  };  
  box.appendChild(b);  
 });  
}  
function showResults(){document.getElementById("listHeading").scrollIntoView({behavior:"smooth",block:"start"});}  
function runSearch(){  
 currentView="all";activeCategory="all";  
 document.getElementById("listHeading").textContent=t().latest;  
 document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b.id==="filterAll"));  
 drawCategories();render();showResults();  
}  
function normalizeSearch(v){return String(v||"").normalize("NFKC").replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\u200c\u200d]/g," ").replace(/\s+/g," ").trim().toLowerCase();}  
function render(){  
 const d=t();  
 const q=normalizeSearch(document.getElementById("search").value);  
 const saved=getSaved();  
 const data=allItems().filter(item=>{  
  const index=categoryKeys().indexOf(item.category);  
  const categoryName=index>=0?d.categoriesList[index]:"";  
  const text=normalizeSearch([item.title,item.description,item.location,categoryName].join(" "));  
  const matches=text.includes(q);  
  const cat=activeCategory==="all"||item.category===activeCategory;  
  const mode=currentView==="saved"?saved.includes(item.id):currentView==="mine"?item.owner==="mine":true;  
  return matches&&cat&&mode;  
 });  
 document.getElementById("total").textContent=data.length;  
 const box=document.getElementById("results");  
 box.innerHTML="";  
 if(!data.length){  
  const empty=document.createElement("div");  
  empty.className="empty";  
  empty.textContent=d.empty;  
  box.appendChild(empty);  
  return;  
 }  
 data.forEach(item=>{  
  const index=categoryKeys().indexOf(item.category);  
  const card=document.createElement("article");  
  card.className="card";  
  card.innerHTML=`  
   <div class="cover">${["🛠️","🛍️","💻","🌍","🤝","📚","🎫","💛"][Math.max(index,0)]}</div>  
   <div class="cardbody">  
    <h3></h3><p></p><div class="meta"></div>  
    <div class="actions">  
     <button class="view"></button>  
     <button class="fav"></button>  
    </div>  
   </div>`;  
  card.querySelector("h3").textContent=item.title;  
  card.querySelector(".cardbody p").textContent=item.description;  
  card.querySelector(".meta").textContent=(item.id.startsWith("demo")?"DEMO · ":item.status==="pending"?message("در انتظار تأیید · ","Pending · "):"")+(d.place+": "+(item.location||d.unknown));  
  card.querySelector(".view").textContent=d.details;  
  card.querySelector(".view").onclick=()=>detail(item.id);  
  card.querySelector(".fav").textContent=saved.includes(item.id)?d.savedLabel:d.save;  
  card.querySelector(".fav").onclick=()=>toggleSaved(item.id);
  if(item.id.startsWith("demo"))card.querySelector(".fav").style.display="none";  
  if(item.owner==="mine"){  
   const edit=document.createElement('button');edit.textContent='✎ '+editText()[0];edit.onclick=()=>openEdit(item.id);card.querySelector('.actions').appendChild(edit);
   const del=document.createElement("button");  
   del.className="delete";  
   del.textContent=d.delete;  
   del.onclick=()=>deleteItem(item.id);  
   card.querySelector(".actions").appendChild(del);  
  }  
  if(isFeatured(item)){
   card.classList.add('pi-featured');
   const badge=document.createElement('div');badge.className='pi-featured-label';badge.textContent='⭐ '+featureText()[0];card.prepend(badge);
  }
  if(onlineUser&&item.owner_id===onlineUser&&item.status==='approved'){
   const promote=document.createElement('button');promote.type='button';promote.className='pi-feature-button';promote.textContent='⭐ '+featureText()[1];promote.onclick=()=>showFeaturedSettings(item.id,promote);card.querySelector('.actions').appendChild(promote);
  }
  box.appendChild(card);
  if(imagePath(item)){const cover=card.querySelector('.cover'), img=document.createElement('img');img.alt=item.title;img.style.cssText='width:100%;height:100%;object-fit:cover;min-height:0';cover.appendChild(img);img.onload=()=>{if(cover.firstChild?.nodeType===3)cover.firstChild.remove();};showImage(item,img);}
  
 });  
}  
function changeView(v,button){  
 currentView=v;activeCategory="all";document.getElementById("search").value="";  
 document.getElementById("listHeading").textContent=v==="saved"?t().saved:v==="mine"?t().mine:t().latest;  
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));  
 if(button)button.classList.add("active");  
 else document.getElementById(v==="saved"?"filterSaved":v==="mine"?"filterMine":"filterAll").classList.add("active");  
 drawCategories();render();showResults();  
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",v==="saved"?b.id==="savedNavButton":v==="all"&&!!b.querySelector("#navHome")));  
}  
function home(button){  
 currentView="all";activeCategory="all";document.getElementById("search").value="";  
 window.scrollTo({top:0,behavior:"smooth"});  
 document.getElementById("listHeading").textContent=t().latest;  
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));  
 button.classList.add("active");  
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));  
 document.getElementById("filterAll").classList.add("active");  
 drawCategories();render();  
}

async function toggleSaved(id){
 const user=onlineUser;
 if(!user){alert(message('ابتدا با حساب پای وارد شوید.','Sign in with Pi first.'));return;}
 if(!onlineItems.some(x=>x.id===id)){alert(message('آگهی نمونه قابل ذخیره نیست.','Demo listings cannot be saved.'));return;}
 if(favoriteBusy)return;
 favoriteBusy=true;
 try{
 if(!favoritesReady)await refreshFavorites();
 if(!favoritesReady||user!==onlineUser)return;
 const db=window.piloopDB;
 const result=getSaved().includes(id)?await db.from('favorites').delete().eq('user_id',user).eq('listing_id',id):await db.from('favorites').insert({user_id:user,listing_id:id});
 if(result.error)throw result.error;
 if(user===onlineUser)await refreshFavorites();
 }catch(error){alert(error.message);}finally{favoriteBusy=false;}
}
function openEdit(id){
 if(document.getElementById('submitButton').disabled)return;
 const item=onlineItems.find(x=>x.id===id&&x.owner_id===onlineUser);if(!onlineUser||!item)return;
 clearDraft();editing={...item};buildCategorySelect();
 for(const [field,value] of Object.entries({title:item.title,category:item.category,description:item.description,location:item.location,contact:item.contact_info}))document.getElementById(field).value=value||'';
 formLabels();document.getElementById('addModal').classList.add('show');
 if(imagePath(item)){clearImage.hidden=false;showImage(item,preview);}
}

  inserted=true;

 form.reset();closeModal('addModal');await refreshListings();changeView('mine',null);alert(original?message('تغییرات ذخیره شد.','Changes saved.'):message('آگهی ثبت شد و در انتظار تأیید است.','Listing submitted for approval.'));
 }catch(error){if(uploaded&&!inserted&&onlineUser===item.owner_id){await window.piloopDB.storage.from("listing-images").remove([uploaded]);}alert(error.message);}finally{button.disabled=false;document.getElementById("cancelButton").disabled=false;}
});
async function deleteItem(id){
 const owner=onlineUser, original=onlineItems.find(x=>x.id===id&&x.owner_id===owner);
 if(!owner||!original||!confirm(t().confirm))return;
 try{const {data,error}=await window.piloopDB.from('listings').delete().eq('id',id).eq('owner_id',owner).select('id,image_url,owner_id');if(error)throw error;if(!data?.length)throw new Error('Listing not deleted');await cleanupListingImage(imagePath(data[0]),owner);await refreshListings();await refreshFavorites();}catch(error){alert(error.message);}
}
